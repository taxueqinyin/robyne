<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Robyne 旗舰 UI 视觉稿</title>
<style>
  :root{
    --bg:#0E0F12; --elev:#16181C; --sunken:#0A0B0D;
    --surf:#1C1F24; --hov:#282D34;
    --brand:#FF6B4A; --brand-mut:rgba(255,107,74,.14);
    --mint:#5AD0BE; --mint-mut:rgba(90,208,190,.14);
    --t1:#F4F5F7; --t2:#A5ACB7; --t3:#717984; --t4:#4B5158;
    --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
    --r1:8px; --r2:12px; --r3:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#08090B; color:var(--t1); padding:36px;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; gap:34px; align-items:flex-start;
    -webkit-font-smoothing:antialiased;
  }
  body.solo{padding:0;gap:0}
  body.solo .label{display:none}
  .label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#6F7681;margin-bottom:9px;font-weight:600}
  .board{position:relative;display:flex;overflow:hidden;background:var(--bg);border-radius:16px;box-shadow:0 26px 64px rgba(0,0,0,.6)}

  /* ---------- icons ---------- */
  .ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ico.sm{width:15px;height:15px}
  .ico.lg{width:22px;height:22px}
  .ico.fill{fill:currentColor;stroke:none}
  .row{display:flex;align-items:center}
  .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

  /* ---------- cover art placeholders ---------- */
  .art{position:relative;overflow:hidden;flex:none;background:#2A2E34}
  .art::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 18% 10%,rgba(255,255,255,.24),transparent 58%)}
  .art::before{content:"";position:absolute;right:-22%;bottom:-24%;width:74%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.13)}
  .a1{background:linear-gradient(155deg,#FF9A6B,#C1472A 58%,#6D2015)}
  .a2{background:linear-gradient(155deg,#8FE0D0,#2E8C86 56%,#12474D)}
  .a3{background:linear-gradient(155deg,#A896F5,#5B45B8 56%,#251A56)}
  .a4{background:linear-gradient(155deg,#FFD98C,#C8912F 56%,#6B4711)}
  .a5{background:linear-gradient(155deg,#F5A6BD,#A63E63 56%,#4B162E)}
  .a6{background:linear-gradient(155deg,#9CBFF5,#3E60A8 56%,#1A2850)}
  .a7{background:linear-gradient(155deg,#CFE884,#6E9A2E 56%,#2F4718)}
  .a8{background:linear-gradient(155deg,#F2A9D8,#8E3E96 56%,#391642)}
  .a9{background:linear-gradient(155deg,#9EE6C4,#2F8F6A 56%,#123A2A)}
  .a10{background:linear-gradient(155deg,#FFC08A,#C2582F 56%,#5E2413)}

  /* ================= DESKTOP SHELL ================= */
  .nav{width:232px;flex:none;display:flex;flex-direction:column;padding:16px 12px 10px;gap:3px;
    background:linear-gradient(180deg,#171A1E,#121417);border-right:1px solid var(--line)}
  .navbrand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px;color:var(--brand)}
  .navbrand b{font-size:15px;font-weight:700;letter-spacing:.01em;color:var(--t1)}
  .userchip{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:11px;
    background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:12px}
  .avatar{width:30px;height:30px;border-radius:999px;flex:none;
    background:linear-gradient(150deg,#FFB27A,#B0492A);border:1px solid rgba(255,255,255,.16)}
  .usermeta{flex:1;min-width:0}
  .usermeta .un{font-size:12.5px;font-weight:600}
  .usermeta .ul{font-size:10.5px;color:var(--t3);margin-top:2px}
  .navsec{display:flex;align-items:center;gap:8px;padding:16px 9px 7px;font-size:11px;font-weight:600;
    letter-spacing:.06em;color:var(--t3)}
  .navsec .newbtn{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t2);
    border:1px solid var(--line2);border-radius:999px;padding:2px 8px}
  .navitem{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:9px;
    color:var(--t2);font-size:13px;font-weight:450}
  .navitem.on{background:linear-gradient(90deg,rgba(255,107,74,.17),rgba(255,107,74,.03));color:#FFA184;font-weight:600}
  .navitem .badge{margin-left:auto;font-size:10.5px;color:var(--t3);background:rgba(255,255,255,.06);
    border-radius:999px;padding:1px 7px}
  .navitem.on .badge{background:rgba(255,107,74,.2);color:#FFA184}
  .plrow{display:flex;align-items:center;gap:10px;height:40px;padding:0 9px;border-radius:9px;color:var(--t2);font-size:12.5px}
  .plrow .plcov{width:28px;height:28px;border-radius:7px}
  .plrow.on{background:rgba(255,255,255,.055);color:var(--t1)}
  .navfoot{margin-top:auto;display:flex;align-items:center;gap:11px;padding:10px;border-radius:9px;
    color:var(--t2);font-size:13px;border-top:1px solid var(--line)}
  .navsecrow{display:flex;align-items:center;gap:8px;padding:14px 9px 6px;font-size:10.5px;font-weight:600;
    letter-spacing:.07em;color:var(--t4)}
  .navsecrow .ln{flex:1;height:1px;background:var(--line)}
  .navmini{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:8px;
    color:var(--t3);font-size:12.5px}
  .navmini:hover{background:rgba(255,255,255,.045);color:var(--t2)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
  .topbar{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;
    background:rgba(20,22,26,.66);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
  .navarrow{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
  .navarrow.dim{color:var(--t4)}
  .searchbox{flex:1;max-width:430px;height:34px;border-radius:999px;display:flex;align-items:center;gap:9px;
    padding:0 14px;background:rgba(255,255,255,.055);border:1px solid var(--line);color:var(--t3);font-size:12.5px}
  .searchbox .kbd{margin-left:auto;font-size:10.5px;border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--t3)}
  .topright{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--t2)}
  .topico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .topico.on{color:var(--brand);background:var(--brand-mut)}
  .winbtns{display:flex;gap:2px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line);color:var(--t3)}
  .wb{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
  .wb.close{color:#E4736A}

  .above{flex:1;min-height:0;display:flex}
  .above .content{order:1}
  .above .queue{order:2}
  .content{flex:1;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column;
    padding:20px 28px 0;background:var(--sunken)}
  .content::before{content:"";position:absolute;left:-10%;right:-10%;top:-160px;height:420px;pointer-events:none;
    background:radial-gradient(52% 100% at 20% 0%,rgba(255,107,74,.17),transparent 68%),
               radial-gradient(46% 90% at 76% 6%,rgba(90,208,190,.10),transparent 70%)}
  .content>*{position:relative;z-index:1}

  .pagehead{display:flex;align-items:flex-end;gap:14px;padding:4px 0 16px}
  .pagetitle{font-size:22px;font-weight:660;letter-spacing:.005em}
  .pagesub{font-size:12px;color:var(--t3);margin-top:5px}
  .sec{display:flex;align-items:center;gap:10px;padding:16px 0 11px}
  .sec h3{font-size:15.5px;font-weight:640}
  .sec .sub{font-size:11.5px;color:var(--t3)}
  .sec .more{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:12px;color:var(--t3)}

  .hero{position:relative;height:142px;border-radius:var(--r3);overflow:hidden;padding:18px 22px;
    display:flex;flex-direction:column;justify-content:flex-end;gap:9px;border:1px solid rgba(255,255,255,.09);
    background:linear-gradient(105deg,#331912 0%,#632C1C 42%,#A8492E 76%,#D2744B 100%)}
  .hero .glow{position:absolute;inset:0;background:radial-gradient(70% 120% at 16% 100%,rgba(255,255,255,.22),transparent 60%)}
  .hero .bigart{position:absolute;right:-26px;top:-30px;width:210px;height:210px;border-radius:20px;
    transform:rotate(14deg);box-shadow:0 26px 50px rgba(0,0,0,.45);opacity:.92}
  .hero .tag{align-self:flex-start;font-size:10.5px;font-weight:600;letter-spacing:.06em;
    background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 10px}
  .hero h2{font-size:20px;font-weight:680;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .hero p{font-size:12px;color:rgba(255,255,255,.78)}
  .heroacts{position:absolute;right:22px;bottom:18px;display:flex;align-items:center;gap:9px}
  .btn{display:flex;align-items:center;gap:7px;height:32px;padding:0 15px;border-radius:999px;
    font-size:12.5px;font-weight:600;background:var(--brand);color:#160C09}
  .btn.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:550}

  .covergrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .card{display:flex;flex-direction:column;gap:7px;min-width:0}
  .card .cov{position:relative;width:100%;aspect-ratio:1/1;border-radius:10px;border:1px solid rgba(255,255,255,.07)}
  .card .cov .play{position:absolute;right:7px;bottom:7px;width:28px;height:28px;border-radius:999px;z-index:2;
    background:var(--brand);color:#160C09;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .card .ct{font-size:12.5px;font-weight:540;line-height:1.32}
  .card .cs{font-size:10.5px;color:var(--t3);margin-top:1px}
  .playcount{position:absolute;left:7px;top:7px;z-index:2;display:flex;align-items:center;gap:3px;font-size:10px;
    color:#fff;background:rgba(0,0,0,.4);border-radius:999px;padding:2px 7px;backdrop-filter:blur(6px)}

  .minirow{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:9px}
  .minirow:hover{background:var(--hov)}
  .minirow .art{width:28px;height:28px;border-radius:7px}
  .minirow .mt{flex:1;min-width:0;font-size:12.5px}
  .minirow .ma{font-size:11px;color:var(--t3);margin-top:2px}
  .minirow .md{font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums}

  /* ---------- table ---------- */
  .toolbar{display:flex;align-items:center;gap:9px;padding:0 0 14px}
  .pillbtn{display:flex;align-items:center;gap:7px;height:31px;padding:0 13px;border-radius:8px;font-size:12.5px;
    color:var(--t2);border:1px solid var(--line2);background:rgba(255,255,255,.03)}
  .pillbtn.primary{background:var(--brand);color:#160C09;border-color:transparent;font-weight:650}
  .toolbar .sp{margin-left:auto}
  .thead,.trow{display:grid;gap:14px;align-items:center;padding:0 12px}
  .thead{height:32px;font-size:11.5px;color:var(--t3);border-bottom:1px solid var(--line);letter-spacing:.02em}
  .trow{height:52px;border-radius:9px;border-bottom:1px solid rgba(255,255,255,.035)}
  .trow.sel{background:linear-gradient(90deg,rgba(255,107,74,.17),rgba(255,107,74,.05));border-bottom-color:transparent}
  .trow .n{font-size:12px;color:var(--t3);text-align:right;font-variant-numeric:tabular-nums}
  .trow.sel .n{color:var(--brand)}
  .trow .art{width:36px;height:36px;border-radius:7px}
  .tt{font-size:13.5px;font-weight:520}
  .ta{font-size:11.5px;color:var(--t3);margin-top:3px}
  .talb{font-size:12.5px;color:var(--t2)}
  .tdur{font-size:12.5px;color:var(--t3);text-align:right;font-variant-numeric:tabular-nums}
  .qchips{display:flex;align-items:center;gap:5px;margin-left:8px;flex:none}
  .chip{font-size:9.5px;font-weight:600;letter-spacing:.03em;padding:1.5px 6px;border-radius:4px;
    border:1px solid var(--line2);color:var(--t3)}
  .chip.hq{color:var(--mint);border-color:rgba(90,208,190,.42);background:var(--mint-mut)}
  .rowacts{display:flex;align-items:center;gap:4px;margin-left:auto;color:var(--t3)}
  .rowacts .ra{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
  .eq{display:flex;align-items:flex-end;gap:2px;height:13px}
  .eq i{display:block;width:2.5px;border-radius:2px;background:var(--brand);animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.18s}
  .eq i:nth-child(3){animation-delay:.36s}
  @keyframes eq{0%,100%{height:4px}50%{height:13px}}

  /* ---------- queue region ---------- */
  /* ---------- page-level shared parts ---------- */
  .two-pane{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;flex:1;min-height:0}
  .pane{display:flex;flex-direction:column;min-height:0;border-radius:var(--r2);
    background:var(--surf);border:1px solid var(--line);padding:14px 16px}
  .pane h4{font-size:12px;font-weight:640;color:var(--t2);letter-spacing:.04em;margin-bottom:10px}
  .segbar{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:rgba(255,255,255,.05);
    border:1px solid var(--line)}
  .segbar b{display:flex;align-items:center;gap:5px;height:26px;padding:0 12px;border-radius:7px;
    font-size:11.5px;font-weight:560;color:var(--t3)}
  .segbar b.on{background:var(--brand-mut);color:#FFA184;font-weight:680}
  .tagwrap{display:flex;flex-wrap:wrap;gap:7px}
  .tchip{font-size:11.5px;color:var(--t2);border:1px solid var(--line2);background:rgba(255,255,255,.04);
    border-radius:999px;padding:4px 11px;flex:none}
  .tchip.on{background:var(--brand-mut);border-color:rgba(255,107,74,.34);color:#FFA184;font-weight:600}
  .collist{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;border:1px solid transparent}
  .collist:hover{background:var(--hov)}
  .collist.on{background:var(--brand-mut);border-color:rgba(255,107,74,.26)}
  .collist .cov{width:54px;height:54px;border-radius:7px;flex:none}
  .collist .ct{font-size:12.5px;font-weight:560}
  .collist.on .ct{color:#FFA184}
  .collist .cd{font-size:10.5px;color:var(--t3);margin-top:3px}
  .collist .cgo{margin-left:auto;color:var(--t4)}
  .dethead{display:flex;align-items:center;gap:15px;padding-bottom:14px}
  .dethead .cov{width:74px;height:74px;border-radius:9px;flex:none}
  .dethead .dt{font-size:17px;font-weight:680}
  .dethead .dd{font-size:11.5px;color:var(--t2);margin-top:4px}
  .dethead .dm{font-size:10.5px;color:var(--t3);margin-top:3px}
  .emptybox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--t3);font-size:12.5px;text-align:center;padding:20px}
  .emptybox .ei{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.05);color:var(--t4)}
  .hintbox{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;
    background:var(--surf);border:1px solid var(--line);font-size:11.5px;color:var(--t2)}
  /* ---------- modal surfaces (plugin import / config, overflow sheets) ---------- */
  .scrim{position:absolute;inset:0;background:rgba(8,9,11,.62);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:5}
  .dlg{width:520px;max-width:88%;border-radius:14px;background:var(--elev);
    border:1px solid var(--line2);box-shadow:0 30px 70px rgba(0,0,0,.66);overflow:hidden}
  .dlg .dh{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
  .dlg .dh .di{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--brand-mut);color:var(--brand)}
  .dlg .dt{font-size:14.5px;font-weight:640}
  .dlg .ds{font-size:11px;color:var(--t3);margin-top:2px}
  .dlg .db{padding:2px 18px 16px}
  .dlg .df{padding:12px 18px;display:flex;justify-content:flex-end;gap:9px;
    border-top:1px solid var(--line);background:rgba(255,255,255,.018)}
  .field{border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.04);padding:11px 13px}
  .field .fl{font-size:11px;color:var(--t3);margin-bottom:5px}
  .field .fv{font-size:13px;color:var(--t1)}
  .field.on{border-color:var(--brand);background:var(--brand-mut)}
  .field .fe{font-size:10.5px;color:#E4736A;margin-top:6px}
  .vrow+.vrow{margin-top:11px}
  .sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;background:var(--elev);
    border-top:1px solid var(--line2);box-shadow:0 -18px 46px rgba(0,0,0,.6);padding:8px 10px 12px;z-index:5}
  .sheet .sh{width:34px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin:6px auto 12px}
  .sheet .si2{display:flex;align-items:center;gap:13px;padding:12px 12px;border-radius:10px;font-size:13px}
  .sheet .si2 .sic{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.055);color:var(--t2)}
  .sheet .si2 .sbadge{margin-left:auto;font-size:11px;color:var(--t3)}
  .setrow{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:10px}
  .setrow+.setrow{border-top:1px solid var(--line)}
  .setrow .si{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.055);color:var(--t2)}
  .setrow .st{flex:1;min-width:0}
  .setrow .s1{font-size:13px;font-weight:520}
  .setrow .s2{font-size:11px;color:var(--t3);margin-top:2px}
  .setrow .sv{font-size:11.5px;color:var(--t2);flex:none}
  .setrow .sc{margin-left:auto;display:flex;align-items:center;gap:7px;flex:none}
  .switch{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none}
  .switch i{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:999px;background:#8C939D;
    transition:none}
  .switch.on{background:rgba(255,107,74,.36)}
  .switch.on i{left:19px;background:var(--brand)}
  .toggle-group{display:inline-flex;gap:8px;flex:none}
  .modepick{display:flex;gap:8px;flex:none}
  .modepick div{font-size:11.5px;padding:4px 12px;border-radius:8px;color:var(--t3);
    border:1px solid var(--line2);background:rgba(255,255,255,.04)}
  .modepick div.on{background:var(--brand-mut);border-color:transparent;color:#FFA184;font-weight:640}
  .stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:8px;
    background:rgba(255,255,255,.04);flex:none}
  .stepper b{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
  .stepper span{font-size:11.5px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
  .swatches{display:flex;gap:5px;flex:none}
  .swatches i{width:20px;height:20px;border-radius:6px;border:1px solid rgba(255,255,255,.16)}
  .swatches i.on{box-shadow:0 0 0 2px var(--brand)}
  .kbdlist{display:flex;flex-direction:column;gap:2px}
  .krow{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:9px}
  .krow+.krow{border-top:1px solid var(--line)}
  .krow .kn{min-width:150px}
  .krow .kk{margin-left:auto;display:flex;gap:5px;align-items:center}
  .kkey{font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--line2);
    background:rgba(255,255,255,.05);color:var(--t2)}
  .kkey.none{color:var(--t4);font-style:italic}
  .taskrow{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:9px}
  .taskrow:hover{background:var(--hov)}
  .taskrow .cov{width:40px;height:40px;border-radius:7px;flex:none}
  .taskrow .tt{flex:1;min-width:0}
