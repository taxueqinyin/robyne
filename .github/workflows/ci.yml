name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the older run useless. Cancelling it
# keeps a force-pushed PR from burning minutes on a tree nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version this tree is developed against. A floating
          # `stable` means CI can start failing because of a Flutter change
          # instead of a change in the repository, which trains everyone to
          # ignore red.
          flutter-version: '3.41.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The bundled vendor bundle is generated from tool/vendor_entry.js with
      # esbuild. It is committed, so tests do not need it rebuilt — but a
      # commit that changed the entry point without rebuilding would silently
      # ship a stale bundle. Verifying the output is byte-identical catches
      # that.
      #
      # `npm ci`, not `npm install`: the bundle's bytes depend on the esbuild
      # version, and an unpinned install picks up whatever is newest. That
      # made this check fail on a tree whose source was unchanged.
      - name: Verify the vendor bundle matches its source
        run: |
          npm ci
          node tool/build_vendor.mjs
          git diff --exit-code -- assets/js/musicfree_vendor.js

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      # Coverage is uploaded as an artifact rather than sent to a service:
      # there is no account wired up, and a number nobody reads is noise.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # Codegen is checked separately because drift's generated file is committed.
  # A hand-edit to app_database.g.dart, or a schema change without rerunning
  # build_runner, would otherwise pass analyze and fail at runtime.
  codegen:
    name: Generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate
        run: dart run build_runner build

      - name: Fail if generated files changed
        # `git diff --exit-code` compares content, so a regeneration that
        # only touched a file's timestamp is not a failure. `git status
        # --porcelain` would report that as a change.
        run: git diff --exit-code
