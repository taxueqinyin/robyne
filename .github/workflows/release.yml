name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Signing is optional on purpose. Without the secrets the build still
      # produces an installable APK signed with the debug key, so a fork can
      # cut a build immediately; with them it produces a properly signed one.
      # The alternative — failing when the secrets are absent — means nobody
      # can build a release until they have set up a keystore.
      - name: Decode the signing keystore
        if: ${{ vars.SIGN_ANDROID == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks

      - name: Build APK
        run: |
          if [ "$SIGN_ANDROID" != "true" ]; then
            echo "::warning::No keystore configured — this APK is signed with the debug key and is not a distributable release. Set the ANDROID_* secrets and SIGN_ANDROID to sign it properly."
          fi
          flutter build apk --release \
            --build-name="${TAG_NAME#v}" \
            --build-number="$BUILD_NUMBER"
        env:
          SIGN_ANDROID: ${{ vars.SIGN_ANDROID }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: robyne-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      # The build output is a directory: the .exe, its DLLs and the `data`
      # folder. It only runs as a directory, so the release artifact is a
      # zip of the directory rather than the bare .exe.
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "robyne-windows-x64-$tag.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: robyne-windows
          path: robyne-windows-x64-*.zip

  macos:
    name: macOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No signing identity is configured, so this stays ad-hoc signed. See
      # docs/RELEASING.md for what turning it into a supported platform takes.
      - name: Build
        run: flutter build macos --release

      - name: Package
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # `ditto`, not `zip`: a .app bundle relies on symlinks in its
          # Frameworks/Versions layout, and a plain zip dereferences them into
          # duplicated files. The bundle then fails to load its embedded
          # Flutter framework.
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/robyne.app \
            "robyne-macos-unsigned-$tag.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: robyne-macos
          path: robyne-macos-unsigned-*.zip

  release:
    name: Publish release
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    # A tag push sets `github.ref` to the tag itself; a manual dispatch asked
    # to rebuild an existing tag instead arrives with `github.ref` set to the
    # branch it was dispatched from. Without the fallback, redoing a release
    # from the Actions tab uploads artifacts that nothing publishes.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.event.inputs.tag, 'v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Needed only for the changelog below, which reads `git log` between the
      # previous tag and this one. The default checkout is a shallow single
      # commit, which cannot see either.
      - name: Check out history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip
          generate_release_notes: true
      # The generated changelog lists what changed but not what each artifact
      # is worth. The macOS bundle is neither tested nor signed, and a user
      # who downloads it unawares gets a Gatekeeper warning that reads like
      # the app is broken.
      #
      # The changelog is rewritten from scratch instead of appended to,
      # because `generate_release_notes` itself appends to an existing body:
      # re-running a tag leaves the previous run's copy of the changelog in
      # place and stacks a second one under it.
      - name: Warn about the macOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # The changelog for every release in the tag's range. `gh release
          # view` cannot produce it, so it is assembled the same way
          # `generate_release_notes` does: the commits since the previous tag.
          previous_tag=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || echo '')
          changelog=$(
            if [ -n "$previous_tag" ]; then
              git log --reverse --pretty='* %s (%h)' "$previous_tag..$tag"
            else
              git log --reverse --pretty='* %s (%h)' "$tag"
            fi
          )
          warning=$(cat <<'NOTES'
          ## 下载说明 / Download notes

          - `robyne-windows-x64-*.zip`：Windows 版，解压后整个目录一起运行。
          - `app-release.apk`：Android 版，已签名，可直接安装。
          - `robyne-macos-unsigned-*.zip`：**未经测试、未签名、未公证**，务必先看下方说明。

          ### macOS 版本免责声明 / macOS artifact disclaimer

          这个 macOS 构建**从未在真实的 Mac 上运行过**，CI 只证明它能够编译通过：

          - 播放、托盘、插件、桌面歌词等功能能否正常工作**完全未知**
          - **未签名、未公证**：macOS 会拒绝启动它，**解除拦截的步骤见下**
          - 请勿用于处理重要数据或生产环境

          ### macOS 解除拦截 / Getting past Gatekeeper

          按顺序尝试：

          1. 打开「系统设置 → 隐私与安全性」，滚到「安全性」一栏，出现提示后点
             **「仍要打开」**。（macOS 13 Ventura 及以后请走这里。）
          2. 如果系统提示**「已损坏，无法打开，您应该将它移到废纸篓」**且不给任
             何打开选项 —— 那是 quarantine 属性造成的，**并不是包真的损坏**。在终
             端执行，路径换成你放 `robyne.app` 的实际位置：

             ```bash
             xattr -cr /Applications/robyne.app
             ```

          如果你有 Mac 并愿意试跑，欢迎在 Issues 里反馈哪些功能可用、哪些不可用
          —— 那是把 macOS 变成正式支持平台的第一步。详见
          [docs/RELEASING.md](./docs/RELEASING.md)。
          NOTES
          )
          printf '## What'"'"'s Changed\n\n%s\n\n%s\n' "$changelog" "$warning" \
            | gh release edit "$tag" --notes-file -
