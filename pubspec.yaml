name: robyne
description: "A cross-platform local music player with MusicFree plugin support"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Audio Playback
  just_audio: ^0.9.46
  just_audio_media_kit: ^2.0.6
  media_kit_libs_audio: ^1.0.5
  audio_service: ^0.18.17

  # JS Execution Engine
  flutter_js: ^0.8.1

  # Network
  dio: ^5.8.0+1
  dio_smart_retry: ^6.0.0

  # Metadata
  audio_metadata_reader: ^1.1.0

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  logger: ^2.5.0
  equatable: ^2.0.7
  collection: ^1.19.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1

  # Platform Specific
  permission_handler: ^11.4.0
  file_picker: ^9.2.2
  share_plus: ^10.1.4

  # Localization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1
  freezed: ^2.4.7
  json_serializable: ^6.8.0


flutter:
  uses-material-design: true

  assets:
    - assets/js/
    - assets/js/libs/