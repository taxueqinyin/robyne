name: robyne
description: "Cross-platform audio runtime with MusicFree plugin support"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # JS Runtime
  flutter_js: ^0.8.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Network
  dio: ^5.7.0

  # Audio
  just_audio: ^0.9.44
  just_audio_media_kit: ^2.0.0
  media_kit_libs_windows_audio: ^1.0.9

  # Database (暂时移除，MVP 不需要)
  # drift: ^2.24.0
  # sqlite3_flutter_libs: ^0.5.32

  # Local metadata
  path_provider: ^2.1.5
  path: ^1.9.1

  # File picker
  file_picker: ^8.1.7

  # Logging
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # drift_dev: ^2.24.0
  # build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/js/
